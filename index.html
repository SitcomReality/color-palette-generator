<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Color Palette Generator</title>
    <link rel="stylesheet" href="styles.css">
    <script type="importmap">
    {
        "imports": {
            "chroma-js": "https://cdn.jsdelivr.net/npm/chroma-js@2.4.2/chroma.min.js"
        }
    }
    </script>
</head>
<body>
    <div class="container">
        <h1>Color Palette Generator</h1>
        
        <div class="input-container">
            <div class="color-picker-wrapper">
                <input type="color" id="colorPicker" value="#4287f5">
                <span id="colorValue">#4287f5</span>
            </div>
            
            <div class="harmony-selector">
                <label for="harmonyType">Harmony Type:</label>
                <select id="harmonyType">
                    <option value="complementary">Complementary</option>
                    <option value="analogous">Analogous</option>
                    <option value="triadic">Triadic</option>
                    <option value="tetradic">Tetradic</option>
                    <option value="monochromatic">Monochromatic</option>
                    <option value="splitComplementary">Split Complementary</option>
                </select>
            </div>
            
            <button id="generateBtn">Generate Palette</button>
        </div>
        
        <div class="palette-container" id="paletteContainer">
            <!-- Color swatches will be added here dynamically -->
        </div>
    </div>
    
    <script type="module" src="app.js"></script>

</body>
</html>
